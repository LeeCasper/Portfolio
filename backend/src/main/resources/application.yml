server:
  port: ${PORT:8081}

spring:
  datasource:
    url: jdbc:sqlite:${CONTENT_DATA_PATH:storage/data}/portfolio.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

content:
  storage-root: ${CONTENT_STORAGE_ROOT:storage/media}
  media-base-url: ${CONTENT_MEDIA_BASE_URL:http://localhost:8081/api/files}
  admin-token: ${CONTENT_ADMIN_TOKEN:}
  allowed-origins:
    - ${PUBLIC_APP_ORIGIN:http://localhost:5200}
    - ${PUBLIC_ADMIN_ORIGIN:http://localhost:9530}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
